name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-separator.txt
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # This is the same script a user runs, so it also checks that the install steps work.
      # (--allow-global: the runner's Python is not a virtualenv, but it is disposable.)
      - run: python install.py --allow-global
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
